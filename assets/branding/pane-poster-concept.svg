<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Pane - A browser that keeps work moving when you step away">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#F2F2F2" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <style><![CDATA[
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: .07em; }
    ]]></style>
  </defs>

  <!-- Shell -->
  <rect width="1280" height="640" fill="#101118"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <line x1="48" y1="76" x2="1232" y2="76" stroke="#30313A"/>
  <line x1="48" y1="568" x2="1232" y2="568" stroke="#30313A"/>

  <!-- Top rail -->
  <g class="sans">
    <text x="48" y="52" fill="#F4F4F6" font-size="28" font-weight="650" letter-spacing="-0.035em">Pane</text>
    <rect x="110" y="44" width="5" height="5" fill="#C8E832"/>
  </g>
  <g class="mono" fill="#898A94" font-size="10">
    <text x="838" y="50">OPEN SOURCE</text>
    <text x="980" y="50">LOCAL-FIRST</text>
    <text x="1105" y="50">YOUR MODELS</text>
  </g>

  <!-- Message -->
  <g class="sans">
    <text x="48" y="162" fill="#F4F4F6" font-size="57" font-weight="620" letter-spacing="-0.055em">A browser that</text>
    <text x="48" y="226" fill="#F4F4F6" font-size="57" font-weight="620" letter-spacing="-0.055em">keeps work moving</text>
    <text x="48" y="290" fill="#F4F4F6" font-size="57" font-weight="620" letter-spacing="-0.055em">when you <tspan fill="#C8E832">step away.</tspan></text>

    <text x="48" y="358" fill="#B4B5BD" font-size="18">Pane remembers the thread, learns your routines,</text>
    <text x="48" y="386" fill="#B4B5BD" font-size="18">and gets better as you work.</text>
  </g>

  <!-- Promise rail -->
  <g class="mono" font-size="10">
    <circle cx="52" cy="444" r="4" fill="#C8E832"/>
    <text x="68" y="448" fill="#D5D5DA">REMEMBERS THE THREAD</text>
    <line x1="52" y1="466" x2="226" y2="466" stroke="#3A3B44"/>

    <circle cx="52" cy="494" r="4" fill="#C8E832"/>
    <text x="68" y="498" fill="#D5D5DA">BUILDS YOUR PERSONALISED INTERNET</text>
    <line x1="52" y1="516" x2="334" y2="516" stroke="#3A3B44"/>

    <circle cx="52" cy="544" r="4" fill="#C8E832"/>
    <text x="68" y="548" fill="#D5D5DA">CONTINUES THE WORK</text>
  </g>

  <!-- Living fields -->
  <g>
    <!-- Thread field -->
    <rect x="742" y="102" width="442" height="132" fill="#A8C0E8"/>
    <line x1="742" y1="132" x2="1184" y2="132" stroke="#5676A8" stroke-opacity=".75"/>
    <text class="mono" x="760" y="122" fill="#294367" font-size="9">01 / THREAD</text>
    <text class="sans" x="760" y="166" fill="#101A2A" font-size="25" font-weight="620" letter-spacing="-0.035em">What mattered stays.</text>
    <text class="sans" x="760" y="194" fill="#294367" font-size="13">Research / meetings / decisions</text>
    <g fill="none" stroke="#294367" stroke-width="1.5">
      <path d="M1012 181C1042 148 1074 202 1104 169S1151 150 1166 168"/>
      <circle cx="1012" cy="181" r="5" fill="#C8E832" stroke="none"/>
      <circle cx="1104" cy="169" r="5" fill="#C8E832" stroke="none"/>
      <circle cx="1166" cy="168" r="5" fill="#C8E832" stroke="none"/>
    </g>

    <!-- Personalised Internet field -->
    <rect x="696" y="252" width="500" height="170" fill="#8FCFC0"/>
    <line x1="696" y1="284" x2="1196" y2="284" stroke="#407E72" stroke-opacity=".8"/>
    <text class="mono" x="716" y="274" fill="#25584F" font-size="9">02 / PERSONALISED INTERNET</text>
    <text class="sans" x="748" y="324" fill="#10241F" font-size="29" font-weight="630" letter-spacing="-0.04em">Your work becomes a living web.</text>
    <text class="sans" x="748" y="354" fill="#25584F" font-size="13">Private sites for research, projects and whatever comes next.</text>
    <g transform="translate(716 376)">
      <rect width="112" height="24" fill="#10241F" fill-opacity=".12"/>
      <rect x="122" width="112" height="24" fill="#10241F" fill-opacity=".12"/>
      <rect x="244" width="112" height="24" fill="#10241F" fill-opacity=".12"/>
      <text class="mono" x="10" y="16" fill="#25584F" font-size="8">RESEARCH</text>
      <text class="mono" x="132" y="16" fill="#25584F" font-size="8">PROJECTS</text>
      <text class="mono" x="254" y="16" fill="#25584F" font-size="8">SKILLS</text>
    </g>

    <!-- Continuation field -->
    <rect x="770" y="440" width="414" height="106" fill="#E8C49A"/>
    <line x1="770" y1="470" x2="1184" y2="470" stroke="#9A693C" stroke-opacity=".75"/>
    <text class="mono" x="788" y="460" fill="#6B4729" font-size="9">03 / CONTINUE</text>
    <text class="sans" x="788" y="506" fill="#2A1A10" font-size="24" font-weight="620" letter-spacing="-0.035em">Work moves while you are away.</text>
    <g class="mono" font-size="8" fill="#6B4729">
      <text x="788" y="530">SCHEDULED</text>
      <text x="890" y="530">PROACTIVE</text>
      <text x="984" y="530">WITH APPROVAL</text>
    </g>
  </g>

  <!-- Continuous signal path + Pane mark -->
  <path d="M1196 168H1218V337H1196M696 337H670V493H770" fill="none" stroke="#C8E832" stroke-width="3"/>
  <circle cx="1218" cy="168" r="5" fill="#C8E832"/>
  <circle cx="670" cy="493" r="5" fill="#C8E832"/>
  <g transform="translate(650 294) scale(.82)">
    <path fill="#C8E832" fill-rule="evenodd" clip-rule="evenodd" d="M0 0h100v100H0V0zm66 66h24v24H66V66z"/>
  </g>

  <!-- Footer -->
  <g class="sans">
    <text x="48" y="604" fill="#8F9098" font-size="14">A browser with a soul.</text>
  </g>
  <g class="mono" fill="#8F9098" font-size="9">
    <text x="1038" y="604">YOURS, ON YOUR MACHINE</text>
  </g>
</svg>
