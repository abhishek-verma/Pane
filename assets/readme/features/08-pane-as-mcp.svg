<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Claude Code driving Pane tabs over MCP">
  <defs>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#C8E832"/>
    <stop offset="100%" stop-color="#94B316"/>
  </linearGradient>
  <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
    <path d="M80 0H0V80" fill="none" stroke="#111113" stroke-opacity="0.04"/>
  </pattern>
  <clipPath id="win">
    <rect x="40" y="36" width="880" height="468" rx="5"/>
  </clipPath>
  <style><![CDATA[

  .sans, text:not(.mono) { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 0.04em; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }


  .beam { stroke-dasharray: 5 7; animation: move 1.2s linear infinite; }
  @keyframes move { to { stroke-dashoffset: -24; } }
  .pulse { animation: nodePulse 1.6s ease-in-out infinite; }
  @keyframes nodePulse {
    0%,100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  .active-tab { animation: tabGlow 2.4s ease-in-out infinite; }
  @keyframes tabGlow {
    0%,100% { stroke-opacity: 0.25; }
    50% { stroke-opacity: 0.7; }
  }

  ]]></style></defs>
  <rect width="960" height="540" fill="#FFFFFF"/>
  <rect width="960" height="540" fill="url(#grid)"/>


  <g clip-path="url(#win)">
    <rect x="40" y="36" width="880" height="468" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1"/>
    <rect x="40" y="36" width="880" height="32" fill="#FFFFFF"/>
    <line x1="40" y1="68" x2="920" y2="68" stroke="#E2E2E2"/>
    <text class="mono" x="56" y="57" fill="#6B6B72" font-size="10">PANE / MCP SESSION</text>
    <circle cx="830" cy="52" r="3.5" fill="#C8E832"/>
    <text class="mono" x="902" y="57" text-anchor="end" fill="#6B6B72" font-size="10">CONNECTED</text>
    <rect x="40" y="68" width="880" height="436" fill="#FFFFFF"/>

    <!-- left: terminal (charcoal region) -->
    <rect x="40" y="68" width="400" height="436" fill="#1A1B22"/>
    <text class="mono" x="60" y="100" fill="#6B6B72" font-size="10">CLAUDE · CONNECTED TO PANE MCP</text>
    <text x="60" y="132" fill="#C8E832" font-size="12">$</text>
    <text x="76" y="132" fill="#F3F3F5" font-size="12">list_tabs</text>
    <text class="mono" x="60" y="154" fill="#6B6B72" font-size="10">→ 4 TABS · ACTIVE: DOCS.ACME.DEV</text>
    <text x="60" y="184" fill="#C8E832" font-size="12">$</text>
    <text x="76" y="184" fill="#F3F3F5" font-size="12">navigate /api/auth#oauth</text>
    <text class="mono" x="60" y="206" fill="#6B6B72" font-size="10">→ OK · SCROLLED TO OAUTH</text>
    <text x="60" y="236" fill="#C8E832" font-size="12">$</text>
    <text x="76" y="236" fill="#F3F3F5" font-size="12">extract_text pre.code</text>

    <g transform="translate(60 264)">
      <rect width="360" height="112" rx="5" fill="#24252C" stroke="#2E2E33"/>
      <text x="14" y="26" fill="#F3F3F5" font-size="12" font-weight="500">Extracted into context</text>
      <text class="mono" x="14" y="50" fill="#6B6B72" font-size="11">POST /OAUTH/TOKEN</text>
      <text class="mono" x="14" y="70" fill="#6B6B72" font-size="11">GRANT_TYPE=AUTHORIZATION_CODE</text>
      <text class="mono" x="14" y="94" fill="#6B6B72" font-size="9">REAL BROWSER · YOUR LOGINS · LOCAL</text>
    </g>

    <!-- beam -->
    <path class="beam" d="M440 256 H520" fill="none" stroke="#94B316" stroke-width="1.5" stroke-opacity="0.7"/>
    <circle class="pulse" cx="480" cy="256" r="4" fill="#C8E832"/>

    <!-- right: Pane tabs (white shell) -->
    <rect x="520" y="68" width="400" height="436" fill="#FFFFFF"/>
    <line x1="520" y1="68" x2="520" y2="504" stroke="#E2E2E2"/>
    <text class="mono" x="540" y="96" fill="#6B6B72" font-size="10">PANE WINDOW</text>
    <text x="540" y="116" fill="#6B6B72" font-size="11">Driven by your coding agent</text>

    <rect class="active-tab" x="540" y="140" width="360" height="44" rx="5" fill="#FFFFFF" stroke="#C8E832" stroke-width="1.5"/>
    <text x="556" y="166" fill="#111113" font-size="12">docs.acme.dev/api/auth</text>

    <rect x="540" y="196" width="360" height="44" rx="5" fill="#FFFFFF" stroke="#E2E2E2"/>
    <text x="556" y="222" fill="#6B6B72" font-size="12">github.com/acme/web</text>
    <rect x="540" y="252" width="360" height="44" rx="5" fill="#FFFFFF" stroke="#E2E2E2"/>
    <text x="556" y="278" fill="#6B6B72" font-size="12">localhost:3000</text>

    <g transform="translate(540 320)">
      <rect width="360" height="56" rx="5" fill="#FFFFFF" stroke="#E2E2E2"/>
      <rect x="0" y="6" width="2" height="44" fill="#C8E832"/>
      <text x="14" y="24" fill="#111113" font-size="13" font-weight="500">Pane as MCP</text>
      <text class="mono" x="14" y="42" fill="#6B6B72" font-size="9">CLAUDE CODE · CURSOR · GEMINI CLI</text>
    </g>
  </g>
</svg>
