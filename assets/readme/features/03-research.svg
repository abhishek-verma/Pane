<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Customer research threaded across tabs into a citable outline">
  <defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f4f1ee"/>
    <stop offset="50%" stop-color="#ebe7e2"/>
    <stop offset="100%" stop-color="#e4dfd8"/>
  </linearGradient>
  <radialGradient id="glow" cx="70%" cy="40%" r="45%">
    <stop offset="0%" stop-color="#e07a2f" stop-opacity="0.16"/>
    <stop offset="55%" stop-color="#e07a2f" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#e07a2f" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f4a35f"/>
    <stop offset="100%" stop-color="#df7327"/>
  </linearGradient>
  <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
    <path d="M56 0H0V56" fill="none" stroke="#1c1814" stroke-opacity="0.05"/>
  </pattern>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#1c1814" flood-opacity="0.12"/>
  </filter>
  <clipPath id="win">
    <rect x="40" y="36" width="880" height="468" rx="16"/>
  </clipPath>
  <style><![CDATA[

  text, .font { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }


  .node { animation: softPulse 3.2s ease-in-out infinite; }
  .n2 { animation-delay: 0.4s; }
  .n3 { animation-delay: 0.8s; }
  @keyframes softPulse {
    0%,100% { opacity: 0.7; }
    50% { opacity: 1; }
  }
  .spine { stroke-dasharray: 3 5; animation: dash 1.4s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -16; } }
  .research-step { animation: stepGlow 2.8s ease-in-out infinite; }
  @keyframes stepGlow {
    0%,100% { stroke-opacity: 0.35; }
    50% { stroke-opacity: 0.85; }
  }
  .step-dot { animation: blink 1.4s steps(1) infinite; }
  @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0.25; } }

  ]]></style></defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#grid)"/>
  <rect width="960" height="540" fill="url(#glow)"/>


  <g filter="url(#shadow)">
    <rect x="40" y="36" width="880" height="468" rx="16" fill="#ffffff"/>
  </g>
  <g clip-path="url(#win)">
    <rect x="40" y="36" width="880" height="468" fill="#ffffff"/>
    <rect x="40" y="36" width="880" height="40" fill="#f5f2ef"/>
    <line x1="40" y1="76" x2="920" y2="76" stroke="#1c1814" stroke-opacity="0.05"/>
    <circle cx="62" cy="56" r="5" fill="#ff5f57"/>
    <circle cx="80" cy="56" r="5" fill="#febc2e"/>
    <circle cx="98" cy="56" r="5" fill="#28c840"/>
    <g transform="translate(124 48)" stroke="#7a7268" stroke-opacity="0.85" stroke-width="1.4" stroke-linecap="round">
      <rect x="0" y="0" width="16" height="16" rx="4.5" fill="none"/>
      <line x1="6" y1="2" x2="6" y2="14"/>
    </g>
    <path d="M164 48 l-8 8 8 8" fill="none" stroke="#7a7268" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M184 48 l8 8 -8 8" fill="none" stroke="#c4bbb2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="208" y="44" width="520" height="24" rx="12" fill="#faf9f7" stroke="#1c1814" stroke-opacity="0.05"/>
    <text x="224" y="60" fill="#7a7268" font-size="12">pane://research/customer-pain</text>
    <line x1="620" y1="76" x2="620" y2="504" stroke="#1c1814" stroke-opacity="0.06"/>

    <rect x="40" y="76" width="580" height="428" fill="#faf9f7"/>
    <!-- tab strip -->
    <rect x="40" y="76" width="52" height="428" fill="#ece8e3"/>
    <rect x="48" y="92" width="36" height="36" rx="8" fill="#e6e1db" stroke="#e07a2f" stroke-opacity="0.55"/>
    <text x="66" y="114" text-anchor="middle" fill="#1c1814" font-size="9">G2</text>
    <rect x="48" y="140" width="36" height="36" rx="8" fill="#ffffff"/>
    <text x="66" y="162" text-anchor="middle" fill="#6b6258" font-size="8">Reddit</text>
    <rect x="48" y="188" width="36" height="36" rx="8" fill="#ffffff"/>
    <text x="66" y="210" text-anchor="middle" fill="#6b6258" font-size="8">Blog</text>
    <rect x="48" y="236" width="36" height="36" rx="8" fill="#ffffff"/>
    <text x="66" y="258" text-anchor="middle" fill="#6b6258" font-size="9">X</text>

    <text x="112" y="112" fill="#1c1814" font-size="17" font-weight="600">“Setup took forever”</text>
    <text x="112" y="134" fill="#6b6258" font-size="12">G2 · Acme Analytics · ★★★★☆</text>
    <rect x="112" y="156" width="400" height="8" rx="4" fill="#e6e1db"/>
    <rect x="112" y="174" width="360" height="8" rx="4" fill="#e6e1db"/>
    <rect x="112" y="192" width="380" height="8" rx="4" fill="#e6e1db"/>
    <rect x="112" y="210" width="300" height="8" rx="4" fill="#e6e1db"/>

    <g transform="translate(112 244)">
      <rect width="400" height="72" rx="12" fill="#ffffff" stroke="#e07a2f" stroke-opacity="0.3"/>
      <text x="18" y="30" fill="#1c1814" font-size="13" font-weight="600">Quoted into research thread</text>
      <text x="18" y="52" fill="#6b6258" font-size="12">Onboarding friction · source kept</text>
    </g>


    <rect x="620" y="76" width="300" height="428" fill="#f3f0ec"/>
    <g transform="translate(638 96) scale(0.14)">
      <path fill="#e07a2f" fill-rule="evenodd" clip-rule="evenodd" d="M0 0h100v100H0V0zm66 66h24v24H66V66z"/>
    </g>
    <text x="660" y="108" fill="#3d3731" font-size="13" font-weight="600">Pane</text>
    <circle cx="900" cy="102" r="4" fill="#5fb872"/>
    <text x="888" y="107" text-anchor="end" fill="#8a8278" font-size="11">Research</text>

    <text x="636" y="134" fill="#6b6258" font-size="11">Why do teams churn in month 1?</text>

    <g class="research-step" transform="translate(636 148)">
      <rect width="268" height="48" rx="12" fill="#fff7f0" stroke="#e07a2f" stroke-width="1.4"/>
      <circle class="step-dot" cx="18" cy="24" r="4" fill="#e07a2f"/>
      <text x="32" y="20" fill="#1c1814" font-size="12" font-weight="600">Researching open tabs</text>
      <text x="32" y="38" fill="#6b6258" font-size="10.5">G2 · Reddit · Blog · threading</text>
    </g>

    <line class="spine" x1="646" y1="212" x2="646" y2="368" stroke="#e07a2f" stroke-opacity="0.35" stroke-width="1.5"/>

    <g class="node" transform="translate(636 204)">
      <circle cx="10" cy="16" r="5" fill="#e07a2f"/>
      <rect x="28" y="0" width="240" height="40" rx="10" fill="#fff7f0"/>
      <text x="40" y="16" fill="#1c1814" font-size="11">Setup took forever</text>
      <text x="40" y="30" fill="#8a8278" font-size="10">G2 · cite</text>
    </g>
    <g class="node n2" transform="translate(636 256)">
      <circle cx="10" cy="16" r="5" fill="#f4a35f"/>
      <rect x="28" y="0" width="240" height="40" rx="10" fill="#fff7f0"/>
      <text x="40" y="16" fill="#1c1814" font-size="11">Docs assume enterprise SSO</text>
      <text x="40" y="30" fill="#8a8278" font-size="10">Reddit · cite</text>
    </g>
    <g class="node n3" transform="translate(636 308)">
      <circle cx="10" cy="16" r="5" fill="#df7327"/>
      <rect x="28" y="0" width="240" height="40" rx="10" fill="#fff7f0"/>
      <text x="40" y="16" fill="#1c1814" font-size="11">No guided first project</text>
      <text x="40" y="30" fill="#8a8278" font-size="10">Blog · cite</text>
    </g>
    <g transform="translate(636 366)">
      <rect width="268" height="52" rx="12" fill="#f5f2ef" stroke="#e07a2f" stroke-opacity="0.35"/>
      <text x="14" y="22" fill="#1c1814" font-size="12" font-weight="600">Outline ready</text>
      <text x="14" y="40" fill="#6b6258" font-size="11">3 themes · 11 sources</text>
    </g>

    <rect x="636" y="452" width="268" height="36" rx="18" fill="#ffffff" stroke="#1c1814" stroke-opacity="0.07"/>
    <text x="652" y="474" fill="#8a8278" font-size="12">Ask Pane anything</text>
    <circle cx="886" cy="470" r="12" fill="url(#accent)"/>
    <path d="M881 470h10M887 466l4 4-4 4" fill="none" stroke="#2a1606" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  </g>
</svg>
