<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Customer research threaded across tabs into a citable outline">
  <defs>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#C8E832"/>
    <stop offset="100%" stop-color="#94B316"/>
  </linearGradient>
  <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
    <path d="M80 0H0V80" fill="none" stroke="#111113" stroke-opacity="0.04"/>
  </pattern>
  <clipPath id="win">
    <rect x="40" y="36" width="880" height="468" rx="5"/>
  </clipPath>
  <style><![CDATA[

  .sans, text:not(.mono) { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 0.04em; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }


  .node { animation: softPulse 3.2s ease-in-out infinite; }
  .n2 { animation-delay: 0.4s; }
  .n3 { animation-delay: 0.8s; }
  @keyframes softPulse {
    0%,100% { opacity: 0.7; }
    50% { opacity: 1; }
  }
  .spine { stroke-dasharray: 3 5; animation: dash 1.4s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -16; } }
  .research-step { animation: stepGlow 2.8s ease-in-out infinite; }
  @keyframes stepGlow {
    0%,100% { stroke-opacity: 0.35; }
    50% { stroke-opacity: 0.85; }
  }
  .step-dot { animation: blink 1.4s steps(1) infinite; }
  @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0.25; } }

  ]]></style></defs>
  <rect width="960" height="540" fill="#FFFFFF"/>
  <rect width="960" height="540" fill="url(#grid)"/>


  <g clip-path="url(#win)">
    <rect x="40" y="36" width="880" height="468" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1"/>
    <rect x="40" y="36" width="880" height="32" fill="#FFFFFF"/>
    <line x1="40" y1="68" x2="920" y2="68" stroke="#E2E2E2"/>
    <text class="mono" x="56" y="57" fill="#6B6B72" font-size="10">PANE / RESEARCH / CUSTOMER PAIN</text>
    <circle cx="830" cy="52" r="3.5" fill="#C8E832"/>
    <text class="mono" x="902" y="57" text-anchor="end" fill="#6B6B72" font-size="10">AGENT RUNNING</text>
    <rect x="40" y="68" width="580" height="436" fill="#A8C0E8"/>
    <line x1="620" y1="68" x2="620" y2="504" stroke="#E2E2E2"/>

    <!-- source rail -->
    <rect x="40" y="68" width="48" height="436" fill="#A8C0E8" stroke="none"/>
    <line x1="88" y1="68" x2="88" y2="504" stroke="#C8D0E0"/>
    <rect x="48" y="84" width="32" height="32" rx="5" fill="#FFFFFF" stroke="#94B316"/>
    <text class="mono" x="64" y="104" text-anchor="middle" fill="#1A2236" font-size="8">G2</text>
    <rect x="48" y="126" width="32" height="32" rx="5" fill="#FFFFFF" stroke="#C8D0E0"/>
    <text class="mono" x="64" y="146" text-anchor="middle" fill="#5A6680" font-size="7">RDDT</text>
    <rect x="48" y="168" width="32" height="32" rx="5" fill="#FFFFFF" stroke="#C8D0E0"/>
    <text class="mono" x="64" y="188" text-anchor="middle" fill="#5A6680" font-size="7">BLOG</text>
    <rect x="48" y="210" width="32" height="32" rx="5" fill="#FFFFFF" stroke="#C8D0E0"/>
    <text class="mono" x="64" y="230" text-anchor="middle" fill="#5A6680" font-size="8">X</text>

    <text class="mono" x="104" y="96" fill="#5A6680" font-size="9">01 SOURCE</text>
    <text x="104" y="120" fill="#1A2236" font-size="16" font-weight="600">“Setup took forever”</text>
    <text class="mono" x="104" y="140" fill="#5A6680" font-size="10">G2 · ACME ANALYTICS</text>
    <rect x="104" y="156" width="380" height="6" rx="1" fill="#C8D0E0" fill-opacity="0.55"/>
    <rect x="104" y="172" width="340" height="6" rx="1" fill="#C8D0E0" fill-opacity="0.55"/>
    <rect x="104" y="188" width="360" height="6" rx="1" fill="#C8D0E0" fill-opacity="0.55"/>
    <rect x="104" y="204" width="280" height="6" rx="1" fill="#C8D0E0" fill-opacity="0.55"/>

    <g transform="translate(104 232)">
      <rect width="380" height="64" rx="5" fill="#FFFFFF" stroke="#94B316" stroke-opacity="0.55"/>
      <text x="14" y="26" fill="#1A2236" font-size="13" font-weight="600">Quoted into research thread</text>
      <text class="mono" x="14" y="46" fill="#5A6680" font-size="10">ONBOARDING FRICTION · SOURCE KEPT</text>
    </g>


    <rect x="620" y="68" width="300" height="436" fill="#FFFFFF"/>
    <text class="mono" x="636" y="96" fill="#6B6B72" font-size="10">AGENT · RESEARCH</text>
    <line x1="620" y1="108" x2="920" y2="108" stroke="#E2E2E2"/>

    <text class="mono" x="636" y="126" fill="#6B6B72" font-size="9">WHY TEAMS CHURN IN MONTH 1</text>

    <g class="research-step" transform="translate(636 138)">
      <rect width="268" height="44" rx="5" fill="#FFFFFF" stroke="#C8E832" stroke-width="1.4"/>
      <circle class="step-dot" cx="16" cy="22" r="3.5" fill="#C8E832"/>
      <text x="28" y="18" fill="#111113" font-size="12" font-weight="500">Researching open tabs</text>
      <text class="mono" x="28" y="34" fill="#6B6B72" font-size="9">G2 · REDDIT · BLOG</text>
    </g>

    <line class="spine" x1="646" y1="196" x2="646" y2="346" stroke="#94B316" stroke-opacity="0.4" stroke-width="1.5"/>

    <g class="node" transform="translate(636 190)">
      <circle cx="10" cy="16" r="4" fill="#94B316"/>
      <rect x="24" y="0" width="244" height="38" rx="5" fill="#FFFFFF" stroke="#E2E2E2"/>
      <text x="36" y="16" fill="#111113" font-size="11">Setup took forever</text>
      <text class="mono" x="36" y="30" fill="#6B6B72" font-size="8">G2 · CITE</text>
    </g>
    <g class="node n2" transform="translate(636 240)">
      <circle cx="10" cy="16" r="4" fill="#C8E832"/>
      <rect x="24" y="0" width="244" height="38" rx="5" fill="#FFFFFF" stroke="#E2E2E2"/>
      <text x="36" y="16" fill="#111113" font-size="11">Docs assume enterprise SSO</text>
      <text class="mono" x="36" y="30" fill="#6B6B72" font-size="8">REDDIT · CITE</text>
    </g>
    <g class="node n3" transform="translate(636 290)">
      <circle cx="10" cy="16" r="4" fill="#94B316"/>
      <rect x="24" y="0" width="244" height="38" rx="5" fill="#FFFFFF" stroke="#E2E2E2"/>
      <text x="36" y="16" fill="#111113" font-size="11">No guided first project</text>
      <text class="mono" x="36" y="30" fill="#6B6B72" font-size="8">BLOG · CITE</text>
    </g>
    <g transform="translate(636 346)">
      <rect width="268" height="44" rx="5" fill="#FFFFFF" stroke="#E2E2E2"/>
      <text x="12" y="18" fill="#111113" font-size="12" font-weight="500">Outline ready</text>
      <text class="mono" x="12" y="34" fill="#6B6B72" font-size="9">3 THEMES · 11 SOURCES</text>
    </g>

    <rect x="632" y="436" width="276" height="56" rx="5" fill="#FAFAFA" stroke="#E2E2E2"/>
    <text x="644" y="458" fill="#6B6B72" font-size="11">Ask Pane anything</text>
    <line x1="642" y1="468" x2="860" y2="468" stroke="#E2E2E2"/>
    <text class="mono" x="644" y="482" fill="#6B6B72" font-size="9">PANE</text>
    <circle cx="886" cy="464" r="11" fill="#C8E832"/>
    <path d="M881 464h10M887 460l4 4-4 4" fill="none" stroke="#1A1F0A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  </g>
</svg>
