<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Personalised Internet — Pane turns an ongoing job search into a living private site">
  <defs>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#C8E832"/>
    <stop offset="100%" stop-color="#94B316"/>
  </linearGradient>
  <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
    <path d="M80 0H0V80" fill="none" stroke="#111113" stroke-opacity="0.04"/>
  </pattern>
  <clipPath id="win">
    <rect x="40" y="36" width="880" height="468" rx="5"/>
  </clipPath>
  <style><![CDATA[

  .sans, text:not(.mono) { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 0.04em; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }


  .score-fill {
    transform-box: fill-box;
    transform-origin: left center;
    animation: fillBar 7s ease-out infinite;
  }
  @keyframes fillBar {
    0%,5% { transform: scaleX(0.08); }
    18%,90% { transform: scaleX(1); }
    100% { transform: scaleX(0.08); }
  }
  .fld-name, .fld-email, .fld-resume, .fld-cover {
    opacity: 0;
    animation: typeIn 7s ease-in-out infinite both;
  }
  .fld-email { animation-delay: 0.7s; }
  .fld-resume { animation-delay: 1.4s; }
  .fld-cover { animation-delay: 2.1s; }
  @keyframes typeIn {
    0%,8% { opacity: 0; }
    18%,78% { opacity: 1; }
    90%,100% { opacity: 0; }
  }
  .focus1, .focus2, .focus3, .focus4 {
    animation: focusRing 7s ease-in-out infinite both;
  }
  .focus2 { animation-delay: 0.7s; }
  .focus3 { animation-delay: 1.4s; }
  .focus4 { animation-delay: 2.1s; }
  @keyframes focusRing {
    0%,6% { stroke-opacity: 0; }
    10%,18% { stroke-opacity: 0.7; }
    26%,100% { stroke-opacity: 0; }
  }
  .submit-btn { animation: submitPress 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes submitPress {
    0%,48% { transform: scale(1); }
    52% { transform: scale(0.96); }
    58%,100% { transform: scale(1); }
  }
  .form-dim { animation: dimForm 7s ease-in-out infinite; }
  @keyframes dimForm {
    0%,58% { opacity: 1; }
    68%,88% { opacity: 0.35; }
    96%,100% { opacity: 1; }
  }
  .success-inner { animation: successIn 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes successIn {
    0%,58% { opacity: 0; transform: scale(0.86); }
    68%,88% { opacity: 1; transform: scale(1); }
    96%,100% { opacity: 0; transform: scale(0.92); }
  }
  .tick-circle {
    fill: none;
    stroke: #94B316;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 180;
    stroke-dashoffset: 180;
    animation: drawCircle 7s ease-in-out infinite;
  }
  @keyframes drawCircle {
    0%,60% { stroke-dashoffset: 180; }
    70%,88% { stroke-dashoffset: 0; }
    96%,100% { stroke-dashoffset: 180; }
  }
  .tick-mark {
    fill: none;
    stroke: #94B316;
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 40;
    stroke-dashoffset: 40;
    animation: drawTick 7s ease-in-out infinite;
  }
  @keyframes drawTick {
    0%,68% { stroke-dashoffset: 40; }
    76%,88% { stroke-dashoffset: 0; }
    96%,100% { stroke-dashoffset: 40; }
  }
  .agent-step1 { animation: stepOn 7s ease-in-out infinite; }
  .agent-step2 { animation: stepOn 7s ease-in-out infinite; animation-delay: 1.2s; }
  .agent-step3 { animation: stepOn 7s ease-in-out infinite; animation-delay: 2.8s; }
  @keyframes stepOn {
    0%,10% { opacity: 0.35; }
    20%,78% { opacity: 1; }
    90%,100% { opacity: 0.35; }
  }

  ]]></style></defs>
  <rect width="960" height="540" fill="#FFFFFF"/>
  <rect width="960" height="540" fill="url(#grid)"/>


  <g clip-path="url(#win)">
    <rect x="40" y="36" width="880" height="468" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1"/>
    <rect x="40" y="36" width="880" height="32" fill="#FFFFFF"/>
    <line x1="40" y1="68" x2="920" y2="68" stroke="#E2E2E2"/>
    <text class="mono" x="56" y="57" fill="#6B6B72" font-size="10">PANE / PERSONALISED INTERNET / JOB SEARCH</text>
    <circle cx="830" cy="52" r="3.5" fill="#C8E832"/>
    <text class="mono" x="902" y="57" text-anchor="end" fill="#6B6B72" font-size="10">SITE LIVE</text>
    <rect x="40" y="68" width="880" height="436" fill="#8FCFC0"/>

    <text x="64" y="100" fill="#10241F" font-size="25" font-weight="620" letter-spacing="-0.04em">Job Search</text>
    <text class="mono" x="64" y="122" fill="#25584F" font-size="9">PRIVATE SITE · BUILT AROUND YOUR WORK</text>

    <g transform="translate(64 140)">
      <rect width="196" height="5" fill="#94B316"/>
      <rect x="204" width="196" height="5" fill="#94B316"/>
      <rect x="408" width="196" height="5" fill="#4A8F82" fill-opacity=".45"/>
      <rect x="612" width="196" height="5" fill="#4A8F82" fill-opacity=".35"/>
      <g class="mono" fill="#25584F" font-size="8">
        <text x="0" y="22">SAVED</text>
        <text x="204" y="22">APPLIED</text>
        <text x="408" y="22">INTERVIEWS</text>
        <text x="612" y="22">FOLLOW-UP</text>
      </g>
    </g>

    <line x1="64" y1="180" x2="896" y2="180" stroke="#4A8F82"/>

    <g transform="translate(64 200)">
      <text class="mono" x="0" y="0" fill="#25584F" font-size="9">TODAY</text>
      <g transform="translate(0 16)">
        <rect width="250" height="92" rx="5" fill="#A8DDD2" stroke="#4A8F82"/>
        <text x="14" y="25" fill="#10241F" font-size="14" font-weight="600">Acme · Product Lead</text>
        <text class="mono" x="14" y="46" fill="#25584F" font-size="8">SAVED · COMPANY PAGE READY</text>
        <text x="14" y="70" fill="#25584F" font-size="11">Research thread · 8 sources</text>
      </g>
      <g transform="translate(266 16)">
        <rect width="250" height="92" rx="5" fill="#A8DDD2" stroke="#4A8F82"/>
        <text x="14" y="25" fill="#10241F" font-size="14" font-weight="600">Northstar · PM</text>
        <text class="mono" x="14" y="46" fill="#25584F" font-size="8">APPLIED · FOLLOW UP FRIDAY</text>
        <text x="14" y="70" fill="#25584F" font-size="11">Notes and next action attached</text>
      </g>
      <g class="success-inner" transform="translate(532 16)">
        <rect width="276" height="92" rx="5" fill="#A8DDD2" stroke="#94B316" stroke-width="1.5"/>
        <text x="14" y="25" fill="#10241F" font-size="14" font-weight="600">GreyOrange · Senior PM</text>
        <text class="mono" x="14" y="46" fill="#25584F" font-size="8">INTERVIEW · PAGE MATERIALISED</text>
        <text x="14" y="70" fill="#25584F" font-size="11">People · news · prep in one place</text>
      </g>
    </g>

    <g transform="translate(64 334)">
      <rect width="808" height="74" rx="5" fill="#A8DDD2" stroke="#4A8F82"/>
      <rect x="0" y="6" width="3" height="62" fill="#94B316"/>
      <text class="mono" x="16" y="22" fill="#25584F" font-size="9">PULSE</text>
      <text x="16" y="45" fill="#10241F" font-size="13" font-weight="500">One living site, not another folder of chats.</text>
      <text x="16" y="63" fill="#25584F" font-size="11">Open a company, continue research, or hand the next action to Pane.</text>
    </g>
  </g>
</svg>
