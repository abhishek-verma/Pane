<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Meeting notes without a bot — Pane records a call tab and answers from the transcript">
  <defs>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#C8E832"/>
    <stop offset="100%" stop-color="#94B316"/>
  </linearGradient>
  <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
    <path d="M80 0H0V80" fill="none" stroke="#111113" stroke-opacity="0.04"/>
  </pattern>
  <clipPath id="win">
    <rect x="40" y="36" width="880" height="468" rx="5"/>
  </clipPath>
  <style><![CDATA[

  .sans, text:not(.mono) { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 0.04em; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }


  .rec-dot { animation: blink 1.4s steps(1) infinite; }
  @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0.2; } }
  .bar { transform-box: fill-box; transform-origin: center bottom; }
  .b1 { animation: wave 1.1s ease-in-out infinite; }
  .b2 { animation: wave 1.1s ease-in-out 0.15s infinite; }
  .b3 { animation: wave 1.1s ease-in-out 0.3s infinite; }
  .b4 { animation: wave 1.1s ease-in-out 0.08s infinite; }
  .b5 { animation: wave 1.1s ease-in-out 0.22s infinite; }
  @keyframes wave {
    0%,100% { transform: scaleY(0.45); opacity: 0.55; }
    50% { transform: scaleY(1); opacity: 1; }
  }

  ]]></style></defs>
  <rect width="960" height="540" fill="#FFFFFF"/>
  <rect width="960" height="540" fill="url(#grid)"/>


  <g clip-path="url(#win)">
    <rect x="40" y="36" width="880" height="468" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1"/>
    <rect x="40" y="36" width="880" height="32" fill="#FFFFFF"/>
    <line x1="40" y1="68" x2="920" y2="68" stroke="#E2E2E2"/>
    <text class="mono" x="56" y="57" fill="#6B6B72" font-size="10">PANE / HOME / MEETINGS</text>
    <circle cx="830" cy="52" r="3.5" fill="#C8E832"/>
    <text class="mono" x="902" y="57" text-anchor="end" fill="#6B6B72" font-size="10">RECORDING</text>
    <rect x="40" y="68" width="580" height="436" fill="#FFFFFF"/>
    <line x1="620" y1="68" x2="620" y2="504" stroke="#E2E2E2"/>

    <!-- main: call -->
    <g class="rec-dot">
      <circle cx="70" cy="96" r="4" fill="#C44A3A"/>
    </g>
    <text class="mono" x="82" y="100" fill="#6B6B72" font-size="10">RECORDING LOCALLY</text>
    <rect x="404" y="84" width="148" height="24" rx="5" fill="#FFFFFF" stroke="#E2E2E2"/>
    <text class="mono" x="478" y="100" text-anchor="middle" fill="#6B6B72" font-size="9">NO BOT JOINED</text>

    <circle cx="330" cy="228" r="44" fill="#FFFFFF" stroke="#E2E2E2"/>
    <circle cx="330" cy="220" r="16" fill="#D4D4D8"/>
    <ellipse cx="330" cy="252" rx="24" ry="12" fill="#D4D4D8"/>
    <text x="330" y="304" text-anchor="middle" fill="#111113" font-size="15" font-weight="600">Vendor pricing call</text>
    <text class="mono" x="330" y="324" text-anchor="middle" fill="#6B6B72" font-size="10">YOU · PRIYA · MARCUS</text>

    <g transform="translate(264 348)">
      <rect class="bar b1" x="0" y="8" width="7" height="28" rx="2" fill="#94B316"/>
      <rect class="bar b2" x="14" y="2" width="7" height="40" rx="2" fill="#C8E832"/>
      <rect class="bar b3" x="28" y="10" width="7" height="24" rx="2" fill="#94B316"/>
      <rect class="bar b4" x="42" y="0" width="7" height="44" rx="2" fill="#C8E832"/>
      <rect class="bar b5" x="56" y="6" width="7" height="32" rx="2" fill="#94B316"/>
      <rect class="bar b2" x="70" y="4" width="7" height="36" rx="2" fill="#C8E832"/>
      <rect class="bar b3" x="84" y="12" width="7" height="20" rx="2" fill="#94B316"/>
      <rect class="bar b1" x="98" y="3" width="7" height="38" rx="2" fill="#C8E832"/>
      <rect class="bar b4" x="112" y="9" width="7" height="26" rx="2" fill="#94B316"/>
      <rect class="bar b5" x="126" y="1" width="7" height="42" rx="2" fill="#C8E832"/>
    </g>


    <rect x="620" y="68" width="300" height="436" fill="#FFFFFF"/>
    <text class="mono" x="636" y="96" fill="#6B6B72" font-size="10">AGENT · MEETINGS</text>
    <line x1="620" y1="108" x2="920" y2="108" stroke="#E2E2E2"/>

    <text class="mono" x="636" y="128" fill="#6B6B72" font-size="9">TRANSCRIPT · ON DEVICE</text>

    <text x="636" y="156" fill="#6B6B72" font-size="11.5">0:42  Priya — annual is fine</text>

    <text x="636" y="176" fill="#111113" font-size="12" font-weight="500">1:08  You — flag the SLA</text>

    <text x="636" y="196" fill="#6B6B72" font-size="11.5">1:31  Marcus — legal by Wed</text>

    <text x="636" y="216" fill="#111113" font-size="12" font-weight="500">2:04  You — ship Friday</text>

    <g transform="translate(636 240)">
      <rect width="268" height="40" rx="5" fill="#FAFAFA" stroke="#E2E2E2"/>
      <text x="12" y="16" fill="#111113" font-size="11">What did we decide</text>
      <text x="12" y="32" fill="#111113" font-size="11">on pricing?</text>
    </g>
    <g transform="translate(636 292)">
      <rect width="268" height="88" rx="5" fill="#FFFFFF" stroke="#E2E2E2"/>
      <rect x="0" y="4" width="2" height="80" fill="#C8E832"/>
      <text x="14" y="22" fill="#111113" font-size="11.5">Annual plan. Flag SLA.</text>
      <text x="14" y="40" fill="#111113" font-size="11.5">Legal reviews by Wed.</text>
      <text x="14" y="58" fill="#111113" font-size="11.5">Update ships Friday.</text>
      <text class="mono" x="14" y="78" fill="#6B6B72" font-size="9">FROM THIS CALL TAB</text>
    </g>

    <rect x="632" y="436" width="276" height="56" rx="5" fill="#FAFAFA" stroke="#E2E2E2"/>
    <text x="644" y="458" fill="#6B6B72" font-size="11">Ask Pane anything</text>
    <line x1="642" y1="468" x2="860" y2="468" stroke="#E2E2E2"/>
    <text class="mono" x="644" y="482" fill="#6B6B72" font-size="9">PANE</text>
    <circle cx="886" cy="464" r="11" fill="#C8E832"/>
    <path d="M881 464h10M887 460l4 4-4 4" fill="none" stroke="#1A1F0A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  </g>
</svg>
