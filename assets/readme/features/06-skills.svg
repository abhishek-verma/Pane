<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Repeated workflow staged as a Pane skill awaiting approval">
  <defs>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#C8E832"/>
    <stop offset="100%" stop-color="#94B316"/>
  </linearGradient>
  <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
    <path d="M80 0H0V80" fill="none" stroke="#111113" stroke-opacity="0.04"/>
  </pattern>
  <clipPath id="win">
    <rect x="40" y="36" width="880" height="468" rx="5"/>
  </clipPath>
  <style><![CDATA[

  .sans, text:not(.mono) { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 0.04em; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }


  .approve { animation: glowBtn 2s ease-in-out infinite; }
  @keyframes glowBtn {
    0%,100% { opacity: 0.88; }
    50% { opacity: 1; }
  }
  .step-accent { animation: stepGlow 3s ease-in-out infinite; }
  @keyframes stepGlow {
    0%,100% { stroke-opacity: 0.35; }
    50% { stroke-opacity: 0.8; }
  }

  ]]></style></defs>
  <rect width="960" height="540" fill="#FFFFFF"/>
  <rect width="960" height="540" fill="url(#grid)"/>


  <g clip-path="url(#win)">
    <rect x="40" y="36" width="880" height="468" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="1"/>
    <rect x="40" y="36" width="880" height="32" fill="#FFFFFF"/>
    <line x1="40" y1="68" x2="920" y2="68" stroke="#E2E2E2"/>
    <text class="mono" x="56" y="57" fill="#6B6B72" font-size="10">PANE / SKILLS / STAGED</text>
    <circle cx="830" cy="52" r="3.5" fill="#C8E832"/>
    <text class="mono" x="902" y="57" text-anchor="end" fill="#6B6B72" font-size="10">AGENT IDLE</text>
    <rect x="40" y="68" width="580" height="436" fill="#FFFFFF"/>
    <line x1="620" y1="68" x2="620" y2="504" stroke="#E2E2E2"/>

    <text x="64" y="100" fill="#111113" font-size="17" font-weight="600">Draft skill: weekly metrics</text>
    <text class="mono" x="64" y="120" fill="#6B6B72" font-size="10">REPEATED SUCCESSFUL TOOL RUNS DETECTED</text>

    <g transform="translate(64 144)">
      <rect class="step-accent" width="532" height="48" rx="5" fill="#FFFFFF" stroke="#C8E832" stroke-width="1.2"/>
      <text class="mono" x="16" y="28" fill="#94B316" font-size="12" font-weight="600">01</text>
      <text x="48" y="28" fill="#111113" font-size="13">Pull dashboard metrics</text>
    </g>
    <g transform="translate(64 204)">
      <rect width="532" height="48" rx="5" fill="#FFFFFF" stroke="#E2E2E2"/>
      <text class="mono" x="16" y="28" fill="#6B6B72" font-size="12" font-weight="600">02</text>
      <text x="48" y="28" fill="#111113" font-size="13">Paste into the Notion doc</text>
    </g>
    <g transform="translate(64 264)">
      <rect width="532" height="48" rx="5" fill="#FFFFFF" stroke="#E2E2E2"/>
      <text class="mono" x="16" y="28" fill="#6B6B72" font-size="12" font-weight="600">03</text>
      <text x="48" y="28" fill="#111113" font-size="13">Ping #growth on Slack</text>
    </g>
    <text class="mono" x="64" y="344" fill="#6B6B72" font-size="10">HEURISTIC MATCH · DRAFT STAGED FOR REVIEW</text>


    <rect x="620" y="68" width="300" height="436" fill="#FFFFFF"/>
    <text class="mono" x="636" y="96" fill="#6B6B72" font-size="10">SKILLS</text>
    <line x1="620" y1="108" x2="920" y2="108" stroke="#E2E2E2"/>

    <g transform="translate(636 124)">
      <rect width="268" height="220" rx="5" fill="#FFFFFF" stroke="#E2E2E2"/>
      <text x="14" y="28" fill="#111113" font-size="13" font-weight="500">Weekly metrics → Notion</text>
      <text class="mono" x="14" y="48" fill="#6B6B72" font-size="9">DRAFTED FROM REPEATED TOOL RUNS</text>
      <rect x="14" y="68" width="220" height="5" rx="1" fill="#E2E2E2"/>
      <rect x="14" y="84" width="180" height="5" rx="1" fill="#E2E2E2"/>
      <rect x="14" y="100" width="200" height="5" rx="1" fill="#E2E2E2"/>
      <text class="mono" x="14" y="132" fill="#6B6B72" font-size="9">RUNS ONLY AFTER YOU APPROVE</text>
      <g class="approve" transform="translate(14 152)">
        <rect width="108" height="32" rx="5" fill="#C8E832"/>
        <text x="54" y="21" text-anchor="middle" fill="#1A1F0A" font-size="12" font-weight="600">Approve</text>
      </g>
      <g transform="translate(132 152)">
        <rect width="88" height="32" rx="5" fill="#FFFFFF" stroke="#E2E2E2"/>
        <text x="44" y="21" text-anchor="middle" fill="#6B6B72" font-size="12">Dismiss</text>
      </g>
    </g>

    <rect x="632" y="436" width="276" height="56" rx="5" fill="#FAFAFA" stroke="#E2E2E2"/>
    <text x="644" y="458" fill="#6B6B72" font-size="11">Ask Pane anything</text>
    <line x1="642" y1="468" x2="860" y2="468" stroke="#E2E2E2"/>
    <text class="mono" x="644" y="482" fill="#6B6B72" font-size="9">PANE</text>
    <circle cx="886" cy="464" r="11" fill="#C8E832"/>
    <path d="M881 464h10M887 460l4 4-4 4" fill="none" stroke="#1A1F0A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  </g>
</svg>
