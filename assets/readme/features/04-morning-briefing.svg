<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Monday morning briefing on Pane home from a scheduled weekday run">
  <defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f4f1ee"/>
    <stop offset="50%" stop-color="#ebe7e2"/>
    <stop offset="100%" stop-color="#e4dfd8"/>
  </linearGradient>
  <radialGradient id="glow" cx="70%" cy="40%" r="45%">
    <stop offset="0%" stop-color="#e07a2f" stop-opacity="0.16"/>
    <stop offset="55%" stop-color="#e07a2f" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#e07a2f" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f4a35f"/>
    <stop offset="100%" stop-color="#df7327"/>
  </linearGradient>
  <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
    <path d="M56 0H0V56" fill="none" stroke="#1c1814" stroke-opacity="0.05"/>
  </pattern>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#1c1814" flood-opacity="0.12"/>
  </filter>
  <clipPath id="win">
    <rect x="40" y="36" width="880" height="468" rx="16"/>
  </clipPath>
  <style><![CDATA[

  text, .font { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }


  .live { animation: livePulse 2.4s ease-in-out infinite; }
  @keyframes livePulse {
    0%,100% { stroke-opacity: 0.3; }
    50% { stroke-opacity: 0.75; }
  }
  .dot { animation: blink 1.6s steps(1) infinite; }
  @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0.25; } }

  ]]></style></defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#grid)"/>
  <rect width="960" height="540" fill="url(#glow)"/>


  <g filter="url(#shadow)">
    <rect x="40" y="36" width="880" height="468" rx="16" fill="#ffffff"/>
  </g>
  <g clip-path="url(#win)">
    <rect x="40" y="36" width="880" height="468" fill="#ffffff"/>
    <rect x="40" y="36" width="880" height="40" fill="#f5f2ef"/>
    <line x1="40" y1="76" x2="920" y2="76" stroke="#1c1814" stroke-opacity="0.05"/>
    <circle cx="62" cy="56" r="5" fill="#ff5f57"/>
    <circle cx="80" cy="56" r="5" fill="#febc2e"/>
    <circle cx="98" cy="56" r="5" fill="#28c840"/>
    <g transform="translate(124 48)" stroke="#7a7268" stroke-opacity="0.85" stroke-width="1.4" stroke-linecap="round">
      <rect x="0" y="0" width="16" height="16" rx="4.5" fill="none"/>
      <line x1="6" y1="2" x2="6" y2="14"/>
    </g>
    <path d="M164 48 l-8 8 8 8" fill="none" stroke="#7a7268" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M184 48 l8 8 -8 8" fill="none" stroke="#c4bbb2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="208" y="44" width="520" height="24" rx="12" fill="#faf9f7" stroke="#1c1814" stroke-opacity="0.05"/>
    <text x="224" y="60" fill="#7a7268" font-size="12">pane://home</text>
    <line x1="620" y1="76" x2="620" y2="504" stroke="#1c1814" stroke-opacity="0.06"/>

    <rect x="40" y="76" width="580" height="428" fill="#faf9f7"/>
    <text x="68" y="112" fill="#1c1814" font-size="22" font-weight="600" letter-spacing="-0.02em">Good morning</text>
    <text x="68" y="136" fill="#6b6258" font-size="13">Monday briefing · from your week in tabs</text>

    
    <rect x="68" y="160" width="524" height="64" rx="12" fill="#ffffff" stroke="#1c1814" stroke-opacity="0.05"/>
    <rect x="68" y="160" width="3" height="64" rx="1.5" fill="url(#accent)"/>
    <text x="88" y="188" fill="#1c1814" font-size="14" font-weight="600">3 decisions from last week’s calls</text>
    <text x="88" y="208" fill="#6b6258" font-size="12">Pricing, SLA, Friday ship — ready to paste</text>

    
    <rect x="68" y="240" width="524" height="64" rx="12" fill="#ffffff" stroke="#1c1814" stroke-opacity="0.05"/>
    <rect x="68" y="240" width="3" height="64" rx="1.5" fill="#5fb872"/>
    <text x="88" y="268" fill="#1c1814" font-size="14" font-weight="600">Investor update draft</text>
    <text x="88" y="288" fill="#6b6258" font-size="12">Built from meetings + shipped PRs</text>

    
    <rect x="68" y="320" width="524" height="64" rx="12" fill="#ffffff" stroke="#1c1814" stroke-opacity="0.05"/>
    <rect x="68" y="320" width="3" height="64" rx="1.5" fill="#6f9fe0"/>
    <text x="88" y="348" fill="#1c1814" font-size="14" font-weight="600">2 follow-ups due today</text>
    <text x="88" y="368" fill="#6b6258" font-size="12">Legal review · customer intro</text>


    <rect x="620" y="76" width="300" height="428" fill="#f3f0ec"/>
    <g transform="translate(638 96) scale(0.14)">
      <path fill="#e07a2f" fill-rule="evenodd" clip-rule="evenodd" d="M0 0h100v100H0V0zm66 66h24v24H66V66z"/>
    </g>
    <text x="660" y="108" fill="#3d3731" font-size="13" font-weight="600">Pane</text>
    <circle cx="900" cy="102" r="4" fill="#5fb872"/>
    <text x="888" y="107" text-anchor="end" fill="#8a8278" font-size="11">Scheduled</text>

    <g transform="translate(636 136)">
      <rect class="live" width="268" height="92" rx="12" fill="#f5f2ef" stroke="#e07a2f" stroke-width="1.5"/>
      <circle class="dot" cx="22" cy="28" r="4" fill="#e07a2f"/>
      <text x="36" y="32" fill="#1c1814" font-size="13" font-weight="600">Morning briefing</text>
      <text x="16" y="56" fill="#6b6258" font-size="12">Every weekday · 8:00 AM</text>
      <text x="16" y="76" fill="#8a8278" font-size="11">Last run · 2 min ago</text>
    </g>
    <g transform="translate(636 248)">
      <rect width="268" height="56" rx="12" fill="#ffffff"/>
      <text x="16" y="24" fill="#4a433c" font-size="12">Competitor scan</text>
      <text x="16" y="42" fill="#8a8278" font-size="11">Fridays · 4:00 PM</text>
    </g>
    <g transform="translate(636 320)">
      <rect width="268" height="56" rx="12" fill="#ffffff"/>
      <text x="16" y="24" fill="#4a433c" font-size="12">Inbox triage</text>
      <text x="16" y="42" fill="#8a8278" font-size="11">Daily · 9:30 AM</text>
    </g>

    <rect x="636" y="452" width="268" height="36" rx="18" fill="#ffffff" stroke="#1c1814" stroke-opacity="0.07"/>
    <text x="652" y="474" fill="#8a8278" font-size="12">Ask Pane anything</text>
    <circle cx="886" cy="470" r="12" fill="url(#accent)"/>
    <path d="M881 470h10M887 466l4 4-4 4" fill="none" stroke="#2a1606" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  </g>
