name: Release Pane Extension

on:
  push:
    tags:
      - "agent-extension/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. agent-extension/v0.0.100
        required: true
        type: string

concurrency:
  group: release-agent-extension
  cancel-in-progress: false

jobs:
  authorize_manual_dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release-core
    steps:
      - run: echo "Manual dispatch approved through release-core."

  release:
    needs: authorize_manual_dispatch
    if: |
      always() &&
      (github.event_name != 'workflow_dispatch' || needs.authorize_manual_dispatch.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: packages/browseros-agent/apps/app

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch || 'main' }}

      - name: Resolve release metadata
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ./scripts/release/resolve-component-release.sh \
            --component agent-extension \
            --tag "$RELEASE_TAG" \
            --default-branch "$DEFAULT_BRANCH"

          VERSION="${RELEASE_TAG#agent-extension/v}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          Maintainer release flow:
          1. Bump packages/browseros-agent/apps/app/package.json in a PR and merge it.
          2. git tag -a agent-extension/v${VERSION} -m "agent-extension v${VERSION}"
          3. git push origin agent-extension/v${VERSION}
          EOF
        working-directory: packages/browseros-agent

      - name: Checkout release commit
        run: git checkout --detach "${{ steps.release.outputs.release_sha }}"
        working-directory: ${{ github.workspace }}

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci
        working-directory: packages/browseros-agent

      - name: Verify release signing secrets
        env:
          AGENT_EXTENSION_PRIVATE_KEY: ${{ secrets.AGENT_EXTENSION_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AGENT_EXTENSION_PRIVATE_KEY:-}" ]; then
            echo "::warning::AGENT_EXTENSION_PRIVATE_KEY not set; CRX will not be published"
            exit 0
          fi
          python3 scripts/release/verify_release_secrets.py
        working-directory: packages/browseros-agent

      - name: Build and zip extension
        run: bun run codegen && bun run zip
        env:
          PANE_BUILD: "true"

      - name: Prepare release artifacts
        id: artifact
        env:
          AGENT_EXTENSION_PRIVATE_KEY: ${{ secrets.AGENT_EXTENSION_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          ZIP_FILE=$(find "$(pwd)/dist" -maxdepth 1 -type f -name '*-chrome.zip' | sort | sed -n '1p')
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No Chrome extension zip found in $(pwd)/dist"
            exit 1
          fi
          RELEASE_ZIP="pane-agent-${VERSION}-chrome.zip"
          cp "$ZIP_FILE" "$RELEASE_ZIP"
          echo "zip_path=$(pwd)/$RELEASE_ZIP" >> "$GITHUB_OUTPUT"

          if [ -n "${AGENT_EXTENSION_PRIVATE_KEY:-}" ]; then
            bun run ../../scripts/release/pack-extension-crx.ts \
              --zip "$(pwd)/$RELEASE_ZIP" \
              --output "$(pwd)/pane-agent-${VERSION}.crx" \
              --private-key-env AGENT_EXTENSION_PRIVATE_KEY \
              --expected-app-id biedncddmddkpapdplhcnkhhplnfgbif
            echo "crx_path=$(pwd)/pane-agent-${VERSION}.crx" >> "$GITHUB_OUTPUT"
            echo "codebase_asset=pane-agent-${VERSION}.crx" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AGENT_EXTENSION_PRIVATE_KEY not set; publishing zip only (browser bundling requires CRX)"
            echo "codebase_asset=$RELEASE_ZIP" >> "$GITHUB_OUTPUT"
          fi
        working-directory: packages/browseros-agent/apps/app

      - name: Generate update manifest
        id: update_manifest
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          TAG="${{ steps.release.outputs.tag }}"
          CODEBASE="https://github.com/${{ github.repository }}/releases/download/${TAG}/${{ steps.artifact.outputs.codebase_asset }}"
          MANIFEST_PATH="${GITHUB_WORKSPACE}/updates/extensions/update-manifest.xml"
          bun run scripts/release/generate-extension-update-manifest.ts \
            --app-id biedncddmddkpapdplhcnkhhplnfgbif \
            --version "$VERSION" \
            --codebase "$CODEBASE" \
            --output "$MANIFEST_PATH" \
            --merge-from "$MANIFEST_PATH"
          echo "manifest_path=$MANIFEST_PATH" >> "$GITHUB_OUTPUT"
        working-directory: packages/browseros-agent

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AGENT_PATH="packages/browseros-agent/apps/app"
          RELEASE_SHA="${{ steps.release.outputs.release_sha }}"
          PREV_TAG="${{ steps.release.outputs.previous_tag }}"

          if [ -z "$PREV_TAG" ]; then
            echo "Initial release" > /tmp/release-notes.md
          else
            COMMITS=$(git log "$PREV_TAG..$RELEASE_SHA" --pretty=format:"%H" -- "$AGENT_PATH")

            if [ -z "$COMMITS" ]; then
              echo "No notable changes." > /tmp/release-notes.md
            else
              echo "## What's Changed" > /tmp/release-notes.md
              echo "" >> /tmp/release-notes.md

              while IFS= read -r SHA; do
                SUBJECT=$(git log -1 --pretty=format:"%s" "$SHA")
                PR_NUM=$(gh api "/repos/${{ github.repository }}/commits/${SHA}/pulls" --jq '.[0].number // empty' 2>/dev/null)

                if [ -n "$PR_NUM" ] && ! echo "$SUBJECT" | grep -qF "(#${PR_NUM})"; then
                  echo "- ${SUBJECT} (#${PR_NUM})" >> /tmp/release-notes.md
                else
                  echo "- ${SUBJECT}" >> /tmp/release-notes.md
                fi
              done <<< "$COMMITS"
            fi
          fi
        working-directory: ${{ github.workspace }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          TITLE="Pane Extension - v${{ steps.release.outputs.version }}"
          ASSETS=("${{ steps.artifact.outputs.zip_path }}")
          if [ -n "${{ steps.artifact.outputs.crx_path }}" ]; then
            ASSETS+=("${{ steps.artifact.outputs.crx_path }}")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating"
            gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/release-notes.md
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TITLE" \
              --notes-file /tmp/release-notes.md \
              "${ASSETS[@]}"
          fi
        working-directory: ${{ github.workspace }}

      - name: Update extension manifests via PR
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          cp "${{ steps.update_manifest.outputs.manifest_path }}" /tmp/update-manifest.xml
          cp /tmp/update-manifest.xml /tmp/bundled-manifest.xml
          bun -e "
          const fs = require('node:fs');
          const xml = fs.readFileSync('/tmp/bundled-manifest.xml', 'utf8');
          const agentBlock = xml.match(/<app appid=\\\"biedncddmddkpapdplhcnkhhplnfgbif\\\">[\\s\\S]*?<\\/app>/);
          if (!agentBlock) throw new Error('agent extension block missing');
          fs.writeFileSync('/tmp/bundled-manifest.xml', \`<?xml version='1.0' encoding='UTF-8'?>\\n<gupdate xmlns=\\\"http://www.google.com/update2/response\\\" protocol=\\\"2.0\\\">\\n\${agentBlock[0]}\\n</gupdate>\\n\`);
          "
          cp /tmp/update-manifest.xml updates/extensions/update-manifest.xml
          cp /tmp/bundled-manifest.xml updates/extensions/bundled-manifest.xml
          packages/browseros-agent/scripts/release/commit-updates-via-pr.sh \
            "$DEFAULT_BRANCH" \
            "chore/extension-update-manifest-v${VERSION}" \
            "chore: update extension manifests for v${VERSION}" \
            updates/extensions/update-manifest.xml \
            updates/extensions/bundled-manifest.xml
        working-directory: ${{ github.workspace }}

      - name: Update CHANGELOG.md via PR
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          DATE=$(date -u +"%Y-%m-%d")
          BRANCH="docs/agent-extension-changelog-v${VERSION}"
          CHANGELOG="packages/browseros-agent/apps/app/CHANGELOG.md"

          git fetch origin "$DEFAULT_BRANCH" --no-tags
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"

          {
            head -n 1 "$CHANGELOG"
            echo ""
            echo "## v${VERSION} (${DATE})"
            echo ""
            cat /tmp/release-notes.md
            echo ""
            tail -n +2 "$CHANGELOG"
          } > /tmp/new-changelog.md
          mv /tmp/new-changelog.md "$CHANGELOG"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$CHANGELOG"
          git commit -m "docs: update agent extension changelog for v${VERSION}"
          git push origin "$BRANCH"

          gh pr create \
            --title "docs: update agent extension changelog for v${VERSION}" \
            --body "Auto-generated changelog update for Pane Extension v${VERSION}." \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH"

          gh pr merge "$BRANCH" --squash --auto || true
        working-directory: ${{ github.workspace }}
