# Pane macOS arm64 signed incremental compile (no clean / gclient sync).
# Browser patches / C++ changed; Chromium base tag unchanged.
# Unsigned sibling: release.macos.arm64.unsigned.incremental.yaml

build:
  type: release
  architecture: arm64

gn_flags:
  file: build/config/gn/flags.macos.release.gn

modules:
  - sparkle_setup
  - resources
  - bundled_extensions
  - chromium_replace
  - string_replaces
  - configure
  - compile
  - sign_macos
  - package_macos
  - sparkle_sign

required_envs:
  - MACOS_CERTIFICATE_NAME
  - NOTARY_KEY
  - NOTARY_KEY_ID
  - NOTARY_ISSUER
  - SPARKLE_PRIVATE_KEY

notifications:
  slack: false
